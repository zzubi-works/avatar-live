<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:image" content="../assets/brand/og.jpg">
<link rel="icon" href="../assets/brand/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/site.css">
<script>try{var t=localStorage.getItem('al-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body class="{{bodyclass}}">
<header class="top">
  <button class="burger" aria-label="{{menu}}" onclick="document.body.classList.toggle('nav-open')"><span></span><span></span><span></span></button>
  <a class="brand" href="index.html"><img src="../assets/brand/logo-wide.png" alt="Avatar Live"></a>
  <div class="top-right">
    <details class="lang"><summary>🌐 <span>{{langname}}</span></summary><div class="lang-menu">{{langs}}</div></details>
    <button class="theme" aria-label="theme" onclick="toggleTheme()">◐</button>
    <a class="btn primary small" href="https://curiousbobby.booth.pm/">{{buy}}</a>
  </div>
</header>
<div class="wrap">
  <aside class="side"><a class="side-home" href="index.html">{{home}}</a>{{side}}</aside>
  <main class="content">
    <article>{{body}}</article>
    {{pager}}
    <p class="updated">{{updated}}: {{date}}</p>
  </main>
  {{toc}}
</div>
<footer class="foot">
  <div class="foot-in">
    <div><img src="../assets/brand/icon-256.png" alt="" width="36" height="36"><b>Avatar Live</b> · Curious Bobby Co.</div>
    <div class="foot-links">{{legal_links}}</div>
    <p>{{disclaimer}}</p>
    <p>{{rights}}</p>
  </div>
</footer>
<div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>
<script>
function toggleTheme(){var d=document.documentElement;var dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('al-theme',d.dataset.theme)}catch(e){}}
(function(){var links=[].slice.call(document.querySelectorAll('.toc a'));if(!links.length)return;var hs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1))});
function on(){var y=scrollY+90,cur=0;hs.forEach(function(h,i){if(h&&h.offsetTop<=y)cur=i});links.forEach(function(a,i){a.classList.toggle('on',i===cur)})}addEventListener('scroll',on,{passive:true});on();})();
</script>
</body>
</html>
